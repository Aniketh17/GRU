<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GRU mobile — Apply tomorrow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F2; color: #16181B; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; font-feature-settings: 'tnum' 1; overflow: hidden;">
  <div style="flex: 1; overflow: hidden; padding: 52px 0 12px; display: flex; flex-direction: column; gap: 12px;">
    <header style="padding: 0 16px; display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.015em;">Apply tomorrow</h1>
        <p style="margin: 0; font-size: 12.5px; color: #5F646D;">7 suitable · scored on resume v3</p>
      </div>
      <button type="button" aria-label="Filters" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #E4E4DE; background: #FFFFFF; color: #3B3F46; display: grid; place-items: center; cursor: pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
    </header>
    <div style="display: flex; gap: 8px; padding: 0 16px; overflow-x: auto;">
      <span style="flex: none; height: 32px; padding: 0 12px; border-radius: 999px; background: #16181B; color: #F5F5F2; font-size: 12.5px; font-weight: 600; display: grid; place-items: center;">Shortlist 7</span>
      <span style="flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4E4DE; background: #FFFFFF; font-size: 12.5px; display: grid; place-items: center;">All 42</span>
      <span style="flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4E4DE; background: #FFFFFF; font-size: 12.5px; display: grid; place-items: center;">Saved 5</span>
      <span style="flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4E4DE; background: #FFFFFF; font-size: 12.5px; display: grid; place-items: center;">Review 3</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px;">
      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
        <article style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E4E4DE; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
          <a href="MobileJobDetail.dc.html" style="display: flex; gap: 12px; text-decoration: none; color: #16181B;">
            <svg width="44" height="44" viewBox="0 0 36 36" role="img" aria-label="{{j.aria}}" style="flex: none;">
              <circle cx="18" cy="18" r="15" fill="none" stroke="#ECECE6" stroke-width="3"></circle>
              <circle cx="18" cy="18" r="15" fill="none" stroke="{{j.ring}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{j.dash}}" transform="rotate(-90 18 18)"></circle>
              <text x="18" y="21.5" text-anchor="middle" font-size="10.5" font-weight="650" fill="#16181B" font-family="Inter, system-ui, sans-serif">{{j.score}}</text>
            </svg>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-weight: 600; line-height: 1.3;">{{j.title}}</span>
              <span style="font-size: 12.5px; color: #3B3F46;">{{j.company}} · {{j.place}}</span>
              <span style="font-size: 12px; font-weight: 600; color: {{j.closeFg}};">{{j.closes}}</span>
            </span>
          </a>
          <p style="margin: 0; font-size: 12.5px; color: #5F646D;">✓ {{j.strength}} · {{j.gap}}</p>
          <div style="display: flex; gap: 8px;">
            <button type="button" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #E4E4DE; background: transparent; color: #16181B; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Save</button>
            <button type="button" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #E4E4DE; background: transparent; color: #16181B; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Dismiss</button>
            <a href="MobileJobDetail.dc.html" style="flex: 1.3; height: 40px; border-radius: 10px; background: #1F6F68; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none; display: grid; place-items: center;">Review</a>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Primary" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 26px; background: #FFFFFF; border-top: 1px solid #E4E4DE; font-size: 11px; text-align: center; color: #5F646D;">
    <a href="MobileToday.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #5F646D; text-decoration: none;">Today</a>
    <a href="MobileJobs.dc.html" aria-current="page" style="min-height: 48px; display: grid; place-items: center; color: #16181B; font-weight: 600; text-decoration: none;"><span style="padding: 4px 12px; border-radius: 999px; background: #E2EFEC;">Jobs</span></a>
    <a href="Applications.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #5F646D; text-decoration: none;">Applications</a>
    <a href="MobileAgenda.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #5F646D; text-decoration: none;">Agenda</a>
    <a href="MobileSettings.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #5F646D; text-decoration: none;">More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = 2 * Math.PI * 15;
    const j = (score, title, company, place, closes, urgent, strength, gap) => ({ score, title, company, place, closes, strength, gap, aria: 'Match score ' + score + ' out of 100', ring: score >= 65 ? '#1F6F68' : '#B45309', dash: (score / 100 * C).toFixed(1) + ' ' + C.toFixed(1), closeFg: urgent ? '#8F4207' : '#5F646D' });
    return {
      jobs: [
        j(86, 'Graduate Machine Learning Engineer', 'Kōwhai Labs', 'Auckland', 'Closes Tue · 3 days', true, 'RAG project, PyTorch', 'gap: Kubernetes'),
        j(78, 'Junior Backend Developer (TypeScript)', 'Harbourline', 'Remote NZ', 'Closes 28 Nov', false, 'Node, PostgreSQL', 'gap: AWS (preferred)'),
        j(74, 'AI Platform Intern 2027', 'Pūriri Systems', 'Auckland', 'Closes Wed · 4 days', true, 'Python, Docker', 'gap: Go')
      ]
    };
  }
}
</script>
</body>
</html>
