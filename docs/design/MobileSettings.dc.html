<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GRU mobile — More and appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1113; color: #ECEDEE; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; overflow: hidden;">
  <div style="flex: 1; overflow: hidden; padding: 52px 16px 12px; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.015em;">More</h1>

    <section style="border-radius: 16px; background: #171A1D; border: 1px solid #262A2F; overflow: hidden;">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="5">
        <a href="{{l.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-bottom: 1px solid #262A2F; color: #ECEDEE; text-decoration: none;">
          <span style="flex: 1; font-weight: 500;">{{l.label}}</span>
          <span style="font-size: 12.5px; color: {{l.metaFg}}; font-weight: {{l.metaFw}};">{{l.meta}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA1A9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </section>

    <section aria-labelledby="ap" style="border-radius: 16px; background: #171A1D; border: 1px solid #262A2F; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 id="ap" style="margin: 0; font-size: 14.5px; font-weight: 600;">Appearance</h2>
        <span style="font-size: 12px; color: #9CA1A9;">Now dark · light at 9:00 AM</span>
      </div>
      <div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0F1113;">
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border-radius: 9px; border: 0; background: #262A2F; color: #ECEDEE; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;">Automatic</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #C9CCD1; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;">Light</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #C9CCD1; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;">Dark</button>
      </div>
      <div aria-hidden="true" style="position: relative; display: flex; height: 22px; border-radius: 7px; overflow: hidden; border: 1px solid #262A2F;">
        <span style="width: 37.5%; background: #0B0D10;"></span><span style="width: 39.6%; background: #5A5136;"></span><span style="width: 22.9%; background: #0B0D10;"></span>
        <span style="position: absolute; left: 83.2%; top: -2px; bottom: -2px; width: 2px; background: #5DBFB1;"></span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11.5px; color: #9CA1A9;"><span>12 AM</span><span>9:00 light</span><span>6:30 PM dark</span><span>now 7:58 PM</span></div>
      <p style="margin: 0; font-size: 12.5px; color: #9CA1A9;">Pacific/Auckland, including daylight saving. Choosing Light or Dark keeps it until you pick Automatic again.</p>
    </section>

    <section style="border-radius: 16px; background: #171A1D; border: 1px solid #4A2A27; overflow: hidden;">
      <a href="States.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 14px; color: #F4A79D; text-decoration: none; font-weight: 600;">Danger zone: pause, lock, wipe</a>
    </section>
  </div>
  <nav aria-label="Primary" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 26px; background: #171A1D; border-top: 1px solid #262A2F; font-size: 11px; text-align: center;">
    <a href="MobileToday.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #9CA1A9; text-decoration: none;">Today</a>
    <a href="MobileJobs.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #9CA1A9; text-decoration: none;">Jobs</a>
    <a href="Applications.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #9CA1A9; text-decoration: none;">Applications</a>
    <a href="MobileAgenda.dc.html" style="min-height: 48px; display: grid; place-items: center; color: #9CA1A9; text-decoration: none;">Agenda</a>
    <a href="MobileSettings.dc.html" aria-current="page" style="min-height: 48px; display: grid; place-items: center; color: #ECEDEE; font-weight: 600; text-decoration: none;"><span style="padding: 4px 12px; border-radius: 999px; background: #16302C;">More</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const l = (label, href, meta, warn) => ({ label, href, meta, metaFg: warn ? '#F0B872' : '#9CA1A9', metaFw: warn ? '600' : '500' });
    return {
      links: [
        l('Review queue', 'States.dc.html', '2 waiting', true),
        l('Interviews', 'Interviews.dc.html', 'Today 2 PM'),
        l('Notes', 'Notes.dc.html', '48'),
        l('Gmail accounts', 'Settings.dc.html', '1 needs reconnect', true),
        l('Resume & scoring', 'Settings.dc.html', 'v3 active'),
        l('Privacy & export', 'Settings.dc.html', '')
      ]
    };
  }
}
</script>
</body>
</html>
