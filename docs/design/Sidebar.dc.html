<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GRU — Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Primary" style="width: 248px; min-height: 100%; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; background: {{t.side}}; border-right: 1px solid {{t.line}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; font-size: 14px;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px;">
    <span style="width: 30px; height: 30px; border-radius: 9px; background: {{t.ink}}; color: {{t.side}}; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: 0.04em;">G</span>
    <div style="display: flex; flex-direction: column; line-height: 1.2;">
      <span style="font-weight: 700; letter-spacing: 0.08em; font-size: 13px;">GRU</span>
      <span style="font-size: 12px; color: {{t.muted}};">for Ani</span>
    </div>
  </div>

  <button type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.muted}}; font: inherit; font-size: 13px; cursor: pointer; text-align: left;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="flex: 1;">Search or jump to…</span>
    <kbd style="font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid {{t.line}};">Ctrl K</kbd>
  </button>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <a href="Main.dc.html" aria-current="{{cur.today}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.today}}; color: {{fg.today}}; font-weight: {{fw.today}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Today
    </a>
    <a href="Jobs.dc.html" aria-current="{{cur.jobs}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.jobs}}; color: {{fg.jobs}}; font-weight: {{fw.jobs}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>
      <span style="flex: 1;">Jobs</span><span style="font-size: 12px; font-weight: 600; color: {{t.accentText}};">7</span>
    </a>
    <a href="Applications.dc.html" aria-current="{{cur.apps}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.apps}}; color: {{fg.apps}}; font-weight: {{fw.apps}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"></path></svg>Applications
    </a>
    <a href="Interviews.dc.html" aria-current="{{cur.interviews}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.interviews}}; color: {{fg.interviews}}; font-weight: {{fw.interviews}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Interviews
    </a>
    <a href="States.dc.html" aria-current="{{cur.review}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.review}}; color: {{fg.review}}; font-weight: {{fw.review}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>
      <span style="flex: 1;">Review</span><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{t.amberSoft}}; color: {{t.amberText}}; font-size: 11.5px; font-weight: 700; display: grid; place-items: center;">2</span>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <p style="margin: 0 0 4px; padding: 0 10px; font-size: 12px; font-weight: 600; color: {{t.muted}};">Your day</p>
    <a href="Agenda.dc.html" aria-current="{{cur.agenda}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.agenda}}; color: {{fg.agenda}}; font-weight: {{fw.agenda}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg>Agenda &amp; tasks
    </a>
    <a href="Notes.dc.html" aria-current="{{cur.notes}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.notes}}; color: {{fg.notes}}; font-weight: {{fw.notes}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Notes
    </a>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px;">
    <a href="Settings.dc.html" aria-current="{{cur.settings}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; text-decoration: none; background: {{bg.settings}}; color: {{fg.settings}}; font-weight: {{fw.settings}};">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings
    </a>
    <div style="margin-top: 10px; padding: 12px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.surface}}; display: flex; flex-direction: column; gap: 4px;">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.accent}};"></span>All systems normal</span>
      <span style="font-size: 12px; color: {{t.muted}};">Next sync 8:15 AM · Light until 6:30 PM</span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"active":{"editor":"enum","options":["today","jobs","apps","interviews","review","agenda","notes","settings"],"default":"today"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { side:'#EFEFEB', surface:'#FFFFFF', line:'#E4E4DE', ink:'#16181B', ink2:'#3B3F46', muted:'#5F646D', accent:'#1F6F68', accentText:'#17605A', activeBg:'#FFFFFF', amberSoft:'#FBEEDC', amberText:'#8F4207' },
      dark:  { side:'#131518', surface:'#1A1D21', line:'#262A2F', ink:'#ECEDEE', ink2:'#C9CCD1', muted:'#9CA1A9', accent:'#5DBFB1', accentText:'#7FD4C7', activeBg:'#20242A', amberSoft:'#33261A', amberText:'#F0B872' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const active = this.props.active || 'today';
    const keys = ['today','jobs','apps','interviews','review','agenda','notes','settings'];
    const bg = {}, fg = {}, fw = {}, cur = {};
    keys.forEach((k) => {
      const on = k === active;
      bg[k] = on ? t.activeBg : 'transparent';
      fg[k] = on ? t.ink : t.ink2;
      fw[k] = on ? '600' : '500';
      cur[k] = on ? 'page' : 'false';
    });
    return { t, bg, fg, fw, cur };
  }
}
</script>
</body>
</html>
